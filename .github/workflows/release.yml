name: release

# Push a tag like v0.1.0 (matching Cargo.toml's version) to publish binaries
# that `gh extension install TenzonUltra/gh-dags` picks up. gh chooses the
# asset whose name ends in <os>-<arch>.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: gh-dags-linux-amd64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: gh-dags-linux-arm64 }
          - { runner: macos-latest, target: aarch64-apple-darwin, asset: gh-dags-darwin-arm64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, asset: gh-dags-darwin-amd64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Static musl binaries run on any Linux, whatever its glibc.
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
      - run: cp target/${{ matrix.target }}/release/gh-dags ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # Install the published release the way users will.
  install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - run: |
          gh extension install "$GITHUB_REPOSITORY"
          gh dags --version
          test "$(gh dags --version)" = "gh-dags ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
